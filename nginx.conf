server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # React app — client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the "api" container (its name on the
    # docker-compose network, port 3000 inside that container)
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }
}
